{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&amp;family=Roboto+Slab:wght@400;500;600&amp;family=Roboto:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
    {% include head/custom.html %}
  </head>

  <body class="profile-site">
    {% include browser-upgrade.html %}

    <nav class="profile-nav" aria-label="Page sections">
      <div class="profile-nav__inner">
        <a href="#main-content">About</a>
        <a href="#selected-publications">Papers</a>
        <a href="#talks">Talks</a>

    <main class="profile-page" id="main-content">

    </main>
